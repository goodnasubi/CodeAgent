[project]
name = "kb-search"
version = "0.1.0"
description = "不具合報告・問い合わせの知識ベース検索/登録システム"
requires-python = ">=3.10"
dependencies = [
    "markitdown[docx,pptx,xlsx,pdf]>=0.1.0",
    "psycopg[binary]>=3.2",
    "httpx>=0.27",
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "cryptography>=43",
    "python-multipart>=0.0.9",
    "anthropic>=0.120.2",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "openpyxl>=3.1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/kb"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "integration: PostgreSQL への接続が必要なテスト（KB_TEST_DSN 未設定なら skip）",
]
