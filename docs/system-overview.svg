<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1240 1600" width="1240" height="1600" font-family="'Hiragino Kaku Gothic ProN','Yu Gothic','Noto Sans JP','Meiryo',sans-serif">
  <defs>
    <marker id="arw" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#5E6E78"/>
    </marker>
    <marker id="arwLight" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#8A9AA5"/>
    </marker>
  </defs>

  <rect width="1240" height="1600" fill="#F7F9FB"/>

  <!-- ============ HEADER ============ -->
  <rect x="0" y="0" width="1240" height="122" fill="#2D6FB3"/>
  <text x="620" y="58" text-anchor="middle" font-size="38" font-weight="700" fill="#FFFFFF">このシステムは、なにをするの？</text>
  <text x="620" y="95" text-anchor="middle" font-size="18" fill="#CFE2F5">こまったことを「みんなの記録」からさがして、なければ新しく残しておくしくみ</text>

  <!-- ============ STEP 1 ============ -->
  <rect x="120" y="152" width="1000" height="152" rx="16" fill="#FFFFFF" stroke="#D9E2E8" stroke-width="1.5"/>
  <circle cx="168" cy="200" r="24" fill="#2D6FB3"/>
  <text x="168" y="209" text-anchor="middle" font-size="24" font-weight="700" fill="#FFFFFF">1</text>

  <!-- person icon -->
  <circle cx="248" cy="222" r="15" fill="#2D6FB3"/>
  <path d="M225,262 C225,241 271,241 271,262 Z" fill="#2D6FB3"/>

  <text x="310" y="197" font-size="26" font-weight="700" fill="#23303A">こまったことを、チャットで聞く</text>
  <text x="310" y="232" font-size="17" fill="#5E6E78">「プリンターが動かない」「エラー ORA-01555 が出た」のように、ふつうの言葉でOK。</text>
  <text x="310" y="262" font-size="17" fill="#5E6E78">文章だけでなく、写真・エクセル・Word のファイルもいっしょに貼れる。</text>

  <line x1="620" y1="310" x2="620" y2="348" stroke="#5E6E78" stroke-width="2.5" marker-end="url(#arw)"/>

  <!-- ============ STEP 2 ============ -->
  <rect x="120" y="356" width="1000" height="272" rx="16" fill="#FFFFFF" stroke="#D9E2E8" stroke-width="1.5"/>
  <circle cx="168" cy="404" r="24" fill="#2D6FB3"/>
  <text x="168" y="413" text-anchor="middle" font-size="24" font-weight="700" fill="#FFFFFF">2</text>
  <text x="212" y="413" font-size="26" font-weight="700" fill="#23303A">AI が、にた記録をさがす</text>

  <rect x="168" y="444" width="428" height="122" rx="12" fill="#EEF5FC" stroke="#B7D3EC" stroke-width="1.5"/>
  <text x="192" y="476" font-size="20" font-weight="700" fill="#2D6FB3">「意味」でさがす</text>
  <text x="192" y="507" font-size="15.5" fill="#41525C">言い方がちがっても、見つけられる。</text>
  <text x="192" y="533" font-size="15.5" fill="#41525C">例：「ログインできない」</text>
  <text x="192" y="555" font-size="15.5" fill="#41525C">　　→「認証に失敗する」も見つかる</text>

  <rect x="644" y="444" width="428" height="122" rx="12" fill="#FDF2E7" stroke="#F0CBA4" stroke-width="1.5"/>
  <text x="668" y="476" font-size="20" font-weight="700" fill="#C4711F">「言葉」でさがす</text>
  <text x="668" y="507" font-size="15.5" fill="#41525C">記号や番号を、そのままピタリと。</text>
  <text x="668" y="533" font-size="15.5" fill="#41525C">例：「ORA-01555」のような</text>
  <text x="668" y="555" font-size="15.5" fill="#41525C">　　エラー番号や型番に強い</text>

  <text x="620" y="600" text-anchor="middle" font-size="17" font-weight="700" fill="#23303A">この2つを同時に使うから、取りこぼしが少ない</text>

  <line x1="620" y1="634" x2="620" y2="672" stroke="#5E6E78" stroke-width="2.5" marker-end="url(#arw)"/>

  <!-- ============ STEP 3 ============ -->
  <rect x="120" y="680" width="1000" height="236" rx="16" fill="#FFFFFF" stroke="#D9E2E8" stroke-width="1.5"/>
  <circle cx="168" cy="728" r="24" fill="#2D6FB3"/>
  <text x="168" y="737" text-anchor="middle" font-size="24" font-weight="700" fill="#FFFFFF">3</text>
  <text x="212" y="737" font-size="26" font-weight="700" fill="#23303A">見つかったか、見つからなかったかで、わかれる</text>

  <rect x="168" y="768" width="428" height="122" rx="12" fill="#EDF7F1" stroke="#A9D6BC" stroke-width="1.5"/>
  <circle cx="196" cy="800" r="10" fill="#3F8F5F"/>
  <path d="M191,800 l4,4 l7,-8" stroke="#FFFFFF" stroke-width="2.5" fill="none" stroke-linecap="round"/>
  <text x="216" y="807" font-size="20" font-weight="700" fill="#3F8F5F">見つかった</text>
  <text x="192" y="840" font-size="15.5" fill="#41525C">その記録を見せてくれる。</text>
  <text x="192" y="866" font-size="15.5" fill="#41525C">新しくわかったことを、書き足せる。</text>

  <rect x="644" y="768" width="428" height="122" rx="12" fill="#FDF2E7" stroke="#F0CBA4" stroke-width="1.5"/>
  <circle cx="672" cy="800" r="10" fill="#E08A3C"/>
  <text x="672" y="806" text-anchor="middle" font-size="15" font-weight="700" fill="#FFFFFF">+</text>
  <text x="692" y="807" font-size="20" font-weight="700" fill="#C4711F">見つからなかった</text>
  <text x="668" y="840" font-size="15.5" fill="#41525C">新しい記録として、作って残す。</text>
  <text x="668" y="866" font-size="15.5" fill="#41525C">次にこまった人が、見つけられる。</text>

  <line x1="620" y1="922" x2="620" y2="960" stroke="#5E6E78" stroke-width="2.5" marker-end="url(#arw)"/>

  <!-- ============ STEP 4 : the metaphor ============ -->
  <rect x="120" y="968" width="1000" height="330" rx="16" fill="#FFFFFF" stroke="#2D6FB3" stroke-width="2.5"/>
  <circle cx="168" cy="1016" r="24" fill="#2D6FB3"/>
  <text x="168" y="1025" text-anchor="middle" font-size="24" font-weight="700" fill="#FFFFFF">4</text>
  <text x="212" y="1025" font-size="26" font-weight="700" fill="#23303A">記録は「本だな」に。さがすための「索引カード」も作る</text>

  <!-- bookshelf -->
  <rect x="196" y="1064" width="330" height="196" rx="12" fill="#EEF5FC" stroke="#B7D3EC" stroke-width="1.5"/>
  <rect x="238" y="1092" width="118" height="86" rx="4" fill="#FFFFFF" stroke="#2D6FB3" stroke-width="2"/>
  <line x1="238" y1="1136" x2="356" y2="1136" stroke="#2D6FB3" stroke-width="2"/>
  <rect x="245" y="1099" width="12" height="30" fill="#2D6FB3"/>
  <rect x="261" y="1099" width="12" height="30" fill="#7FB0DC"/>
  <rect x="277" y="1099" width="12" height="30" fill="#2D6FB3"/>
  <rect x="245" y="1143" width="12" height="30" fill="#7FB0DC"/>
  <rect x="261" y="1143" width="12" height="30" fill="#2D6FB3"/>
  <text x="378" y="1112" font-size="21" font-weight="700" fill="#2D6FB3">本だな</text>
  <text x="378" y="1140" font-size="14.5" fill="#41525C">GitLab / GitHub /</text>
  <text x="378" y="1161" font-size="14.5" fill="#41525C">Redmine</text>
  <rect x="238" y="1196" width="248" height="34" rx="17" fill="#2D6FB3"/>
  <text x="362" y="1219" text-anchor="middle" font-size="16" font-weight="700" fill="#FFFFFF">こっちが「ほんもの」</text>

  <!-- arrow between -->
  <line x1="546" y1="1162" x2="662" y2="1162" stroke="#8A9AA5" stroke-width="2.5" marker-end="url(#arwLight)"/>
  <text x="604" y="1148" text-anchor="middle" font-size="14" fill="#5E6E78">自動で</text>
  <text x="604" y="1192" text-anchor="middle" font-size="14" fill="#5E6E78">作られる</text>

  <!-- index cards -->
  <rect x="682" y="1064" width="330" height="196" rx="12" fill="#FDF2E7" stroke="#F0CBA4" stroke-width="1.5"/>
  <rect x="736" y="1104" width="96" height="66" rx="5" fill="#FFFFFF" stroke="#E08A3C" stroke-width="2"/>
  <rect x="726" y="1094" width="96" height="66" rx="5" fill="#FFFFFF" stroke="#E08A3C" stroke-width="2"/>
  <rect x="716" y="1084" width="96" height="66" rx="5" fill="#FFFFFF" stroke="#E08A3C" stroke-width="2"/>
  <line x1="728" y1="1104" x2="800" y2="1104" stroke="#E08A3C" stroke-width="2"/>
  <line x1="728" y1="1118" x2="800" y2="1118" stroke="#F0CBA4" stroke-width="2"/>
  <line x1="728" y1="1132" x2="778" y2="1132" stroke="#F0CBA4" stroke-width="2"/>
  <text x="852" y="1112" font-size="21" font-weight="700" fill="#C4711F">索引カード</text>
  <text x="852" y="1140" font-size="14.5" fill="#41525C">さがすのを</text>
  <text x="852" y="1161" font-size="14.5" fill="#41525C">速くするためのメモ</text>
  <rect x="716" y="1196" width="284" height="34" rx="17" fill="#E08A3C"/>
  <text x="858" y="1219" text-anchor="middle" font-size="16" font-weight="700" fill="#FFFFFF">なくしても、また作れる</text>

  <text x="620" y="1282" text-anchor="middle" font-size="16.5" fill="#41525C">図書館とおなじ。本がなくなったら困るけれど、索引カードは本さえあれば作り直せる。</text>

  <line x1="620" y1="1304" x2="620" y2="1342" stroke="#5E6E78" stroke-width="2.5" marker-end="url(#arw)"/>

  <!-- ============ STEP 5 ============ -->
  <rect x="120" y="1350" width="1000" height="132" rx="16" fill="#FFFFFF" stroke="#D9E2E8" stroke-width="1.5"/>
  <circle cx="168" cy="1398" r="24" fill="#2D6FB3"/>
  <text x="168" y="1407" text-anchor="middle" font-size="24" font-weight="700" fill="#FFFFFF">5</text>

  <!-- bell -->
  <g transform="translate(250,1402)">
    <path d="M-13,8 C-13,-7 -9,-15 0,-15 C9,-15 13,-7 13,8 Z" fill="#E08A3C"/>
    <line x1="-17" y1="8" x2="17" y2="8" stroke="#E08A3C" stroke-width="3" stroke-linecap="round"/>
    <circle cx="0" cy="14" r="4" fill="#E08A3C"/>
  </g>

  <text x="300" y="1395" font-size="24" font-weight="700" fill="#23303A">大事な記録に「しるし」がついたら、みんなに知らせる</text>
  <text x="300" y="1432" font-size="16.5" fill="#5E6E78">知らせ先は3つ　―　チャット画面 ／ Slack ／ メール</text>
  <text x="300" y="1458" font-size="15" fill="#8A9AA5">どの「しるし」を誰に知らせるかは、管理する人が決めておく。</text>

  <!-- ============ FOOTER NOTE ============ -->
  <rect x="120" y="1504" width="1000" height="72" rx="12" fill="#E9EFF4" stroke="#C9D8E2" stroke-width="1.5"/>
  <text x="150" y="1534" font-size="16.5" font-weight="700" fill="#23303A">会社ごとに、べつべつに使える</text>
  <text x="150" y="1560" font-size="15" fill="#5E6E78">「本だな」は会社ごとに1つだけ選ぶ（まぜて使わない）。使う AI も、会社ごとに選べる。</text>
</svg>
